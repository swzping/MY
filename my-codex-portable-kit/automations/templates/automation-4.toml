version = 1
id = "automation-4"
kind = "heartbeat"
name = "每日知识推进确认"
prompt = "每天晚上主动推进用户的 AI/Agent/LLM 知识库，不只关注工作台，也关注白天输入流筛选。\n\n默认知识库路径：<SW_KNOWLEDGE_VAULT>\n\n读取：\n1. <SW_KNOWLEDGE_VAULT>/00-入口/今日工作台.md\n2. <SW_KNOWLEDGE_VAULT>/00-入口/今日整理建议.md\n3. <SW_KNOWLEDGE_VAULT>/10-输入流/概念雷达/每日筛选/ 中当天或最近的 概念筛选\n4. <SW_KNOWLEDGE_VAULT>/10-输入流/概念雷达/长期追踪/AI-Agent长期概念雷达.md\n5. <SW_KNOWLEDGE_VAULT>/10-输入流/概念雷达/长期追踪/主流模型平台与工具产品雷达.md\n6. <SW_KNOWLEDGE_VAULT>/90-系统/规则/自动整理流程.md\n\n执行方式：\n1. 先找“工作台主动想法”：读取今日工作台里的“待拆解想法”和“下一步问题”。如果有多条，只选最值得推进的 1 条。\n2. 再找“输入流候选”：读取今日整理建议和当天/最近每日概念筛选，只选最值得推进的 1 条。\n3. 用简短中文向用户给出 1-2 个候选：\n   - 候选 A：来自工作台的主动想法。\n   - 候选 B：来自输入流筛选的外部变化/工具/概念。\n4. 每个候选都说明：建议动作、为什么值得推进、是否需要用户确认。\n5. 询问用户回复“1 / 2 / 都推进 / 跳过 / 换一个”。\n6. 不要在没有用户确认的情况下创建原子知识、更新主题地图或写研究备忘录。\n7. 如果用户确认，按确认内容执行：\n   - 创建或更新 20-原子知识/ 中的对应文件。\n   - 必要时创建或更新 40-综合输出/研究备忘录/。\n   - 更新相关 30-主题地图/ 链接。\n   - 更新 00-入口/今日工作台.md，把处理结果记录到“今天新增的原子知识”“今天更新的主题地图”或“今天新增的研究备忘录”。\n8. 如果没有候选，提示可以只记录一个问题或关键词，不强迫整理。\n\n边界：\n- 晚上任务不重新抓新闻。\n- 晚上任务不追求清空输入流。\n- 晚上任务的目标是帮用户从“主动想法”和“输入流候选”里选出今天最值得推进的知识。\n\n遵守 <SW_KNOWLEDGE_VAULT>/90-系统/规则/自动整理流程.md。"
status = "PAUSED"
rrule = "DTSTART;TZID=Asia/Shanghai:20260703T210000\nRRULE:FREQ=DAILY"
