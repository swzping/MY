version = 1
id = "15-t-1"
kind = "heartbeat"
name = "15分钟T+1股票筛选"
prompt = "每次运行时，基于最新可获取的市场数据和公开信息，筛选中国 A 股中适合 T+1 交易思路关注的潜在买入候选。请优先关注流动性、趋势强度、量价配合、题材/行业催化、风险事件、涨跌停状态、成交额、换手率、技术位置和次日可退出风险。输出应包含：候选股票代码与名称、入选理由、关键风险、建议关注价位/条件、仓位与止损提示，并明确说明这只是研究筛选与风险提示，不构成投资建议。若处于非交易时段，请基于最近一个交易日数据和最新公告/新闻给出观察名单。"
status = "PAUSED"
rrule = "FREQ=MINUTELY;INTERVAL=15"
target_thread_id = "<replace-with-target-thread-id>"
