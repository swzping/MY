<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF投资组合再平衡工具 - 计算买卖清单</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">ETF投资组合再平衡工具</h1>
            <p class="text-gray-600">根据目标配置比例，计算需要买卖多少</p>
        </header>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">目标配置</h2>
            <p class="text-gray-600 mb-4">设置你的目标资产配置比例（总和应为100%）</p>
            <div id="targetInputs" class="space-y-3">
                <div class="target-row grid md:grid-cols-12 gap-3 items-center">
                    <div class="md:col-span-5">
                        <input type="text" class="ticker w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="ETF代码/名称">
                    </div>
                    <div class="md:col-span-4">
                        <input type="number" class="target-percent w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="目标比例%" min="0" max="100">
                    </div>
                    <div class="md:col-span-3">
                        <button class="remove-btn px-3 py-2 bg-red-100 text-red-700 rounded-md hover:bg-red-200 disabled:opacity-50 disabled:cursor-not-allowed" disabled>删除</button>
                    </div>
                </div>
            </div>
            <div class="mt-4">
                <button id="addRowBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-md">添加一行</button>
            </div>

            <div class="mt-6 p-4 bg-gray-50 rounded-lg">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-gray-700">已配置比例：</span>
                    <span id="totalTargetPercent" class="font-semibold">0%</span>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">当前持仓和总投入</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">总投资金额</label>
                <input type="number" id="totalInvestment" placeholder="例如：100000"
                       class="w-full md:w-1/3 px-4 py-2 border border-gray-300 rounded-md">
            </div>
        </div>

        <div class="text-center mb-6">
            <button id="calculateBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-8 py-3 rounded-md transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
                计算再平衡买卖清单
            </button>
        </div>

        <!-- Results -->
        <div id="results" class="hidden bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">再平衡操作清单</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="px-4 py-2 text-left">ETF</th>
                            <th class="px-4 py-2 text-right">目标比例</th>
                            <th class="px-4 py-2 text-right">当前市值</th>
                            <th class="px-4 py-2 text-right">目标市值</th>
                            <th class="px-4 py-2 text-right">差额</th>
                            <th class="px-4 py-2 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody">
                    </tbody>
                </table>
            </div>
        </div>

        <footer class="mt-8 text-center text-gray-500 text-sm">
            <p>工具仅供参考，不构成投资建议 · © 2026 工具集</p>
        </footer>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg opacity-0 transition-opacity duration-300 hidden"></div>
    </div>

    <script src="../../shared/utils.js"></script>
    <script>
// DOM Elements
const targetInputs = document.getElementById('targetInputs');
const addRowBtn = document.getElementById('addRowBtn');
const totalTargetPercentEl = document.getElementById('totalTargetPercent');
const totalInvestmentInput = document.getElementById('totalInvestment');
const calculateBtn = document.getElementById('calculateBtn');
const resultsDiv = document.getElementById('results');
const resultBody = document.getElementById('resultBody');

// Add new row
addRowBtn.addEventListener('click', () => {
    const row = document.createElement('div');
    row.className = 'target-row grid md:grid-cols-12 gap-3 items-center';
    row.innerHTML = `
        <div class="md:col-span-5">
            <input type="text" class="ticker w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="ETF代码/名称">
        </div>
        <div class="md:col-span-4">
            <input type="number" class="target-percent w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="目标比例%" min="0" max="100">
        </div>
        <div class="md:col-span-3">
            <button class="remove-btn px-3 py-2 bg-red-100 text-red-700 rounded-md hover:bg-red-200">删除</button>
        </div>
    `;
    targetInputs.appendChild(row);

    // Bind remove button
    const removeBtn = row.querySelector('.remove-btn');
    removeBtn.addEventListener('click', () => {
        row.remove();
        updateTotalPercent();
    });

    // Bind input change events
    row.querySelector('.target-percent').addEventListener('input', updateTotalPercent);
    updateTotalPercent();
});

// Update total percentage
function updateTotalPercent() {
    const percentInputs = document.querySelectorAll('.target-percent');
    let total = 0;
    percentInputs.forEach(input => {
        const val = parseFloat(input.value);
        if (!isNaN(val)) total += val;
    });
    totalTargetPercentEl.textContent = total.toFixed(1) + '%';

    // Enable remove button when more than 1 row
    const allRows = document.querySelectorAll('.target-row');
    const removeBtns = document.querySelectorAll('.remove-btn');
    if (allRows.length > 1) {
        removeBtns.forEach(btn => btn.disabled = false);
    } else {
        if (removeBtns[0]) removeBtns[0].disabled = true;
    }

    // Color warning if not 100%
    if (Math.abs(total - 100) > 0.1) {
        totalTargetPercentEl.classList.add('text-red-600');
    } else {
        totalTargetPercentEl.classList.remove('text-red-600');
    }
}

// Initial event
document.querySelector('.target-percent').addEventListener('input', updateTotalPercent);
document.querySelector('.remove-btn').addEventListener('click', () => {
    // Cannot remove first row when it's the only one
});
updateTotalPercent();

// Calculate
calculateBtn.addEventListener('click', () => {
    // Collect data
    const rows = [];
    const domRows = document.querySelectorAll('.target-row');
    domRows.forEach(row => {
        const ticker = row.querySelector('.ticker').value.trim();
        const percent = parseFloat(row.querySelector('.target-percent').value);
        if (ticker && !isNaN(percent) && percent > 0) {
            rows.push({ ticker, targetPercent: percent / 100 });
        }
    });

    const totalInvestment = parseFloat(totalInvestmentInput.value);

    // Validation
    if (rows.length === 0) {
        showToast('请至少添加一个ETF配置');
        return;
    }
    if (isNaN(totalInvestment) || totalInvestment <= 0) {
        showToast('请输入正确的总投资金额');
        return;
    }

    const totalPercent = rows.reduce((sum, r) => sum + r.targetPercent, 0) * 100;
    if (Math.abs(totalPercent - 100) > 1) {
        showToast(`总配置比例为${totalPercent.toFixed(1)}%，请调整到100%`);
        return;
    }

    // Calculate for each ETF: target value = totalInvestment * targetPercent
    // current value estimated proportionally based on current total investment
    const results = rows.map(row => {
        const targetValue = totalInvestment * row.targetPercent;
        const currentValue = targetValue; // Initially equal to target before any price changes
        const diff = targetValue - currentValue;

        return {
            ...row,
            currentValue,
            targetValue,
            diff
        };
    });

    displayResults(results);
    showToast('计算完成');
});

function displayResults(results) {
    resultBody.innerHTML = '';

    results.forEach(r => {
        const row = document.createElement('tr');
        row.className = 'border-t border-gray-200';

        let action, actionClass;
        if (Math.abs(r.diff) < 0.01) {
            action = '无需操作';
            actionClass = 'text-gray-500';
        } else if (r.diff > 0) {
            action = '买入 ' + r.diff.toFixed(2);
            actionClass = 'text-green-600 font-medium';
        } else {
            action = '卖出 ' + Math.abs(r.diff).toFixed(2);
            actionClass = 'text-red-600 font-medium';
        }

        row.innerHTML = `
            <td class="px-4 py-3 font-medium">${r.ticker}</td>
            <td class="px-4 py-3 text-right">${(r.targetPercent * 100).toFixed(1)}%</td>
            <td class="px-4 py-3 text-right">${r.currentValue.toFixed(2)}</td>
            <td class="px-4 py-3 text-right">${r.targetValue.toFixed(2)}</td>
            <td class="px-4 py-3 text-right ${actionClass}">${action}</td>
        `;

        resultBody.appendChild(row);
    });

    resultsDiv.classList.remove('hidden');
}
    </script>
</body>
</html>
