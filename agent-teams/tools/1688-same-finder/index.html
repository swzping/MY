<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1688找同款比价 - 拼多多卖家找货源</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">1688找同款比价</h1>
            <p class="text-gray-600">拼多多卖家找货源，对比不同供应商价格</p>
        </header>

        <!-- Add Product Form -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">添加商品信息</h2>

            <div class="grid md:grid-cols-2 gap-4">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">拼多多商品名称</label>
                    <input type="text" id="productName" placeholder="输入拼多多商品名称"
                           class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">拼多多售价</label>
                    <input type="number" id="pddPrice" placeholder="例如：29.9" step="0.01"
                           class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">商品关键词</label>
                <input type="text" id="keywords" placeholder="多个用空格分隔"
                       class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="text-center">
                <button id="addSupplierBtn"
                        class="bg-green-600 hover:bg-green-700 text-white font-medium px-6 py-2 rounded-md transition-colors">
                    添加供应商
                </button>
            </div>
        </div>

        <!-- Suppliers List -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6 hidden" id="suppliersContainer">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">供应商列表</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="px-4 py-2 text-left">供应商名称</th>
                            <th class="px-4 py-2 text-right">起批量</th>
                            <th class="px-4 py-2 text-right">单价</th>
                            <th class="px-4 py-2 text-right">邮费</th>
                            <th class="px-4 py-2 text-right">利润</th>
                            <th class="px-4 py-2 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="suppliersBody">
                    </tbody>
                </table>
            </div>

            <div class="mt-4 text-center">
                <button id="exportCSVBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md transition-colors">导出CSV</button>
            </div>
        </div>

        <footer class="mt-8 text-center text-gray-500 text-sm">
            <p>© 2026 工具集 · 小而美，解决真问题</p>
        </footer>

        <!-- Toast -->
        <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg opacity-0 transition-opacity duration-300 hidden"></div>
    </div>

    <script src="../../shared/utils.js"></script>
    <script>
// State
let suppliers = [];

// DOM Elements
const productNameInput = document.getElementById('productName');
const pddPriceInput = document.getElementById('pddPrice');
const keywordsInput = document.getElementById('keywords');
const addSupplierBtn = document.getElementById('addSupplierBtn');
const suppliersContainer = document.getElementById('suppliersContainer');
const suppliersBody = document.getElementById('suppliersBody');
const exportCSVBtn = document.getElementById('exportCSVBtn');

// Load saved data from localStorage
document.addEventListener('DOMContentLoaded', () => {
    const saved = getFromLocalStorage('1688_finder_data', '');
    if (saved) {
        try {
            suppliers = JSON.parse(saved);
            renderSuppliers();
            if (suppliers.length > 0) {
                suppliersContainer.classList.remove('hidden');
            }
        } catch (e) {
            console.error('Failed to load saved data');
        }
    }
});

// Add supplier
addSupplierBtn.addEventListener('click', () => {
    const productName = productNameInput.value.trim();
    const pddPrice = parseFloat(pddPriceInput.value);

    if (!productName) {
        showToast('请输入拼多多商品名称');
        return;
    }
    if (isNaN(pddPrice) || pddPrice <= 0) {
        showToast('请输入正确的拼多多售价');
        return;
    }

    // Open modal to add supplier details
    const supplierName = prompt('输入供应商名称：');
    if (!supplierName) return;

    const minQuantity = parseInt(prompt('输入起批量：', '1')) || 1;
    const unitPrice = parseFloat(prompt('输入单价：'));
    if (isNaN(unitPrice) || unitPrice <= 0) {
        showToast('请输入正确的单价');
        return;
    }
    const shipping = parseFloat(prompt('输入邮费：', '0')) || 0;

    const profit = pddPrice - unitPrice - shipping;

    const supplier = {
        id: Date.now(),
        productName,
        pddPrice,
        keywords: keywordsInput.value.trim(),
        supplierName,
        minQuantity,
        unitPrice,
        shipping,
        profit
    };

    suppliers.push(supplier);
    saveData();
    renderSuppliers();
    suppliersContainer.classList.remove('hidden');
    showToast('供应商已添加');

    // Clear form for next - keep product name for convenience
});

function saveData() {
    saveToLocalStorage('1688_finder_data', suppliers);
}

function renderSuppliers() {
    suppliersBody.innerHTML = '';

    suppliers.forEach(s => {
        const row = document.createElement('tr');
        row.className = 'border-t border-gray-200';

        const profitClass = s.profit > 0 ? 'text-green-600 font-medium' : 'text-red-600 font-medium';

        row.innerHTML = `
            <td class="px-4 py-3">${s.supplierName}</td>
            <td class="px-4 py-3 text-right">${s.minQuantity}</td>
            <td class="px-4 py-3 text-right">${s.unitPrice.toFixed(2)}</td>
            <td class="px-4 py-3 text-right">${s.shipping.toFixed(2)}</td>
            <td class="px-4 py-3 text-right ${profitClass}">${s.profit.toFixed(2)}</td>
            <td class="px-4 py-3 text-center">
                <button data-id="${s.id}" class="delete-btn text-red-600 hover:text-red-800">删除</button>
            </td>
        `;

        // Delete button
        row.querySelector('.delete-btn').addEventListener('click', () => {
            if (confirm('确认删除这个供应商？')) {
                suppliers = suppliers.filter(x => x.id !== s.id);
                saveData();
                renderSuppliers();
                if (suppliers.length === 0) {
                    suppliersContainer.classList.add('hidden');
                }
                showToast('已删除');
            }
        });

        suppliersBody.appendChild(row);
    });
}

// Export CSV
exportCSVBtn.addEventListener('click', () => {
    const headers = ['拼多多商品', '拼多多售价', '关键词', '供应商', '起批量', '批发价', '邮费', '利润'];
    const rows = [headers.join(',')];

    suppliers.forEach(s => {
        const row = [
            `"${s.productName.replace(/"/g, '""')}"`,
            s.pddPrice,
            `"${(s.keywords || '').replace(/"/g, '""')}"`,
            `"${s.supplierName.replace(/"/g, '""')}"`,
            s.minQuantity,
            s.unitPrice,
            s.shipping,
            s.profit
        ];
        rows.push(row.join(','));
    });

    const csv = rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '1688-comparison.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showToast('CSV导出成功');
});
    </script>
</body>
</html>
